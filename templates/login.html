{% extends "base.html" %}
{% block title %}Iniciar sesión — Campus Parking{% endblock %}
{% block content %}
<div class="card-cp p-4 auth-card">
  <h1 class="h4 mb-1">Iniciar sesión</h1>
  <p class="text-muted small mb-4">Conductores: usa tu correo. Personal de portería o administración: usa tu usuario.</p>
  <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
    {{ csrf_input() }}
    <div class="mb-3">
      <label for="usuario" class="form-label">Correo o usuario</label>
      <input type="text" class="form-control" id="usuario" name="usuario" value="{{ usuario or '' }}"
             placeholder="nombre@correo.edu" required autofocus autocomplete="username"
             autocapitalize="none" spellcheck="false">
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" class="form-control" id="password" name="password" required
             autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-cp w-100">Iniciar sesión</button>
  </form>
  <hr class="my-4">
  <p class="text-muted small text-center mb-0">
    ¿Aún no tienes cuenta? <a href="{{ url_for('registro') }}">Registra tu vehículo</a>
  </p>
</div>
{% endblock %}
