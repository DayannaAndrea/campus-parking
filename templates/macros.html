{% macro icon(name, cls='') -%}
<svg class="icon {{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'check' -%}
  <path d="M20 6 9 17l-5-5"/>
{%- elif name == 'x' -%}
  <path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == 'alert' -%}
  <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
  <line x1="12" y1="9" x2="12" y2="13"/>
  <line x1="12" y1="17" x2="12.01" y2="17"/>
{%- elif name == 'car' -%}
  <path d="M19 17H5c-1.1 0-2-.9-2-2v-4c0-.2.05-.4.15-.55l1.55-3.05A2 2 0 0 1 6.5 6h11a2 2 0 0 1 1.8 1.4l1.55 3.05c.1.15.15.35.15.55v4c0 1.1-.9 2-2 2z"/>
  <circle cx="7.5" cy="16.5" r="1.5"/>
  <circle cx="16.5" cy="16.5" r="1.5"/>
{%- elif name == 'qr' -%}
  <rect x="3" y="3" width="7" height="7" rx="1"/>
  <rect x="14" y="3" width="7" height="7" rx="1"/>
  <rect x="3" y="14" width="7" height="7" rx="1"/>
  <path d="M14 14h3v3h-3zM14 21h3v-1.5M21 14v3M18 18h3"/>
{%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="9"/>
  <path d="M12 7v5l3 3"/>
{%- elif name == 'pin' -%}
  <path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 0 1 16 0z"/>
  <circle cx="12" cy="10" r="3"/>
{%- elif name == 'download' -%}
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
  <path d="M7 10l5 5 5-5"/>
  <path d="M12 15V3"/>
{%- elif name == 'users' -%}
  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
  <circle cx="9" cy="7" r="4"/>
  <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
{%- elif name == 'shield' -%}
  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
{%- elif name == 'calendar' -%}
  <rect x="3" y="4" width="18" height="18" rx="2"/>
  <path d="M16 2v4M8 2v4M3 10h18"/>
{%- elif name == 'chart' -%}
  <path d="M18 20V10M12 20V4M6 20v-6"/>
{%- elif name == 'folder' -%}
  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
{%- elif name == 'search' -%}
  <circle cx="11" cy="11" r="8"/>
  <path d="M21 21l-4.35-4.35"/>
{%- else -%}
  <circle cx="12" cy="12" r="9"/>
{%- endif -%}
</svg>
{%- endmacro %}

{%- macro page_header(title, subtitle='') -%}
<div class="page-header">
  <h1>{{ title }}</h1>
  {%- if subtitle %}<p class="text-muted mb-0">{{ subtitle }}</p>{% endif %}
</div>
{%- endmacro -%}

{%- macro badge(text, kind='secondary') -%}
<span class="badge-cp badge-{{ kind }}">{{ text }}</span>
{%- endmacro -%}
